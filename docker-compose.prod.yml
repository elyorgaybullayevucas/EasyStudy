# Production: bitta VPS, Docker Compose, Caddy (avtomatik HTTPS, Let's Encrypt).
# Ishga tushirish: cp .env.prod.example .env && nano .env && docker compose -f docker-compose.prod.yml up -d --build
# Tashqariga faqat 80/443 ochiladi; DB va backend faqat ichki tarmoqda.
#
# Tarmoqlar (2026-11: frontend konteyneriga Next.js zaifligi orqali mayner kirganidan keyin ajratildi):
#   web    - caddy <-> frontend/backend. Internetga chiqish YO'Q.
#   data   - backend <-> db. Internetga chiqish YO'Q.
#   egress - internetga chiqish: faqat caddy (sertifikat) va backend (pochta, AI, S3).
# Frontend faqat `web`da: buzib kirilgan taqdirda ham u internetdan hech narsa yuklab ololmaydi,
# hech qayerga ulana olmaydi va bazani ko'rmaydi.
name: easystudy

# Konteyner ichida huquqni oshirib bo'lmaydi, Linux imtiyozlari (capabilities) olib tashlangan
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: easystudy
      POSTGRES_USER: easystudy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da berilishi shart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easystudy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    security_opt:
      - no-new-privileges:true
    logging: &log
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  backend:
    build: ./backend
    restart: unless-stopped
    <<: *hardened
    networks: [web, data, egress]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/easystudy
      SPRING_DATASOURCE_USERNAME: easystudy
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da berilishi shart}
      # Frontend va API bitta domenda (Caddy /api/* ni backendga yo'naltiradi) -> cookie SameSite=Strict ishlaydi
      APP_CORS_ORIGINS: https://${DOMAIN:?DOMAIN .env da berilishi shart}
      APP_COOKIE_SECURE: "true"
      APP_PUBLIC_URL: https://${DOMAIN}
      APP_DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      APP_DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      APP_MEDIA_PROVIDER: ${MEDIA_PROVIDER:-local}
      APP_MEDIA_DIR: /data/media
      APP_S3_ENDPOINT: ${S3_ENDPOINT:-}
      APP_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      APP_S3_BUCKET: ${S3_BUCKET:-easystudy-media}
      APP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      APP_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      APP_S3_REGION: ${S3_REGION:-us-east-1}
      APP_AI_PROVIDER: ${AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      APP_TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JAVA_TOOL_OPTIONS: -Xss512k
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *log

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      API_URL_INTERNAL: http://backend:8080   # server-side render'lar ichki tarmoqdan
      HOSTNAME: 0.0.0.0
    <<: *hardened
    networks: [web]
    # Fayl tizimi faqat o'qish uchun: konteynerga hech narsa yozib (dastur tashlab) bo'lmaydi.
    # Yoziladigan ikki joy xotirada va u yerdan dastur ishga tushmaydi (noexec).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=256m,mode=1777
    # Bitta konteyner butun serverni band qilib qo'ya olmaydi
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    logging: *log

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    # BIND_IP: serverda bir nechta IP bo'lsa, EasyStudy faqat o'zinikini egallaydi (boshqa loyihalar boshqa IP da)
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
      - "${BIND_IP:-0.0.0.0}:443:443/udp"   # HTTP/3
    networks: [web, egress]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *log

networks:
  web:
    internal: true
  data:
    internal: true
  egress:

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
