spring:
  application:
    name: easystudy
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/easystudy}
    username: ${SPRING_DATASOURCE_USERNAME:easystudy}
    password: ${SPRING_DATASOURCE_PASSWORD:easystudy_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
      file-size-threshold: 2MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  demo:
    admin-email: ${APP_DEMO_ADMIN_EMAIL:admin@easystudy.uz}
    admin-password: ${APP_DEMO_ADMIN_PASSWORD:}
  media:
    provider: ${APP_MEDIA_PROVIDER:local}        # local | s3
    dir: ${APP_MEDIA_DIR:./data/media}
    public-url: ${APP_PUBLIC_URL:http://localhost:8080}
    max-video-mb: ${APP_MEDIA_MAX_VIDEO_MB:2000}
    max-audio-mb: ${APP_MEDIA_MAX_AUDIO_MB:200}
    max-image-mb: ${APP_MEDIA_MAX_IMAGE_MB:10}
    url-ttl-minutes: ${APP_MEDIA_URL_TTL_MINUTES:240}
    s3:
      endpoint: ${APP_S3_ENDPOINT:}
      public-endpoint: ${APP_S3_PUBLIC_ENDPOINT:}
      bucket: ${APP_S3_BUCKET:easystudy-media}
      access-key: ${APP_S3_ACCESS_KEY:}
      secret-key: ${APP_S3_SECRET_KEY:}
      region: ${APP_S3_REGION:us-east-1}
  ai:
    provider: ${APP_AI_PROVIDER:none}            # none | claude | fake
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${APP_AI_MODEL:claude-opus-5-5}
    transcription:
      provider: ${APP_TRANSCRIPTION_PROVIDER:none}  # none | openai
      api-key: ${OPENAI_API_KEY:}
      model: ${APP_TRANSCRIPTION_MODEL:whisper-1}

management:
  endpoints:
    web:
      exposure:
        include: health
