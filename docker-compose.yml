name: easystudy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: easystudy
      POSTGRES_USER: easystudy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-easystudy_dev_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host 5433: lokal PostgreSQL 18 allaqachon 5432 da
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easystudy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/easystudy
      SPRING_DATASOURCE_USERNAME: easystudy
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-easystudy_dev_pw}
      APP_JWT_SECRET: ${JWT_SECRET:-change-me-to-a-64-byte-random-base64-secret-change-me-change-me-now}
      APP_CORS_ORIGINS: http://localhost:3000
      APP_DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@easystudy.uz}
      APP_DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      # Media: hozir lokal disk (volume), keyin APP_MEDIA_PROVIDER=s3 + APP_S3_* bilan object storage'ga o'tiladi
      APP_MEDIA_PROVIDER: ${MEDIA_PROVIDER:-local}
      APP_MEDIA_DIR: /data/media
      APP_PUBLIC_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      APP_S3_ENDPOINT: ${S3_ENDPOINT:-}
      APP_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      APP_S3_BUCKET: ${S3_BUCKET:-easystudy-media}
      APP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      APP_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      APP_S3_REGION: ${S3_REGION:-us-east-1}
      # AI tekshiruv: none | claude | fake. claude uchun ANTHROPIC_API_KEY kerak
      APP_AI_PROVIDER: ${AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      APP_TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - media:/data/media
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
